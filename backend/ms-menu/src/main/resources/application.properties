
# ==========================================
# CONFIGURACION DEL MICROSERVICIO
# ==========================================
spring.application.name=ms-menu
server.port=8081

# ==========================================
# BASE DE DATOS - SUPABASE POSTGRESQL
# ==========================================
spring.datasource.url=${DB_MENU_URL}
spring.datasource.username=${DB_MENU_USERNAME}
spring.datasource.password=${DB_MENU_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIKARI CONNECTION POOL
# ==========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# JPA - HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=menu
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY - MIGRACIONES
# ==========================================
spring.flyway.enabled=true
spring.flyway.schemas=menu
spring.flyway.default-schema=menu
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# ==========================================
# SWAGGER - OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# ACTUATOR - MONITOREO
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# CONFIGURACION DE COLORES EN CONSOLA
# ==========================================

spring.output.ansi.enabled=ALWAYS